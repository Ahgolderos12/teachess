[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachess"
version = "0.1.0"
description = "Entrenador personal de ajedrez con IA que aprende del jugador."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
teachess = "teachess.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teachess"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
